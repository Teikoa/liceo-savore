<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My orders · LICEO SAVORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-role="student" data-nav="orders" data-title="Order history">

<div class="section-head" style="margin-top:26px">
    <div>
        <h2>My orders</h2>
        <p>Every pre-order you have placed, newest first</p>
    </div>
    <a class="btn btn-sm" href="menu.html">New order</a>
</div>

<div class="categories" id="order-tabs"></div>

<section class="panel">
    <div class="table-wrap">
        <table class="data">
            <thead>
                <tr>
                    <th>Order</th>
                    <th>Pickup</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th class="num">Total</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="orders-body"></tbody>
        </table>
    </div>
</section>

<!-- ------------------------------------- the student's no-show record -->
<section class="panel">
    <h3>My no-show record</h3>
    <p class="panel-sub">
        3 unclaimed orders within 30 days pauses pre-ordering for 7 days. You can always
        buy at the counter, and the pause lifts on its own.
    </p>

    <div class="table-wrap">
        <table class="data">
            <thead>
                <tr>
                    <th>Recorded</th>
                    <th>Order</th>
                    <th>Remarks</th>
                    <th class="num">Value</th>
                </tr>
            </thead>
            <tbody id="noshow-body"></tbody>
        </table>
    </div>
</section>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="../assets/js/orders.js"></script>
</body>
</html>
