<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My tray · LICEO SAVORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-role="student" data-nav="cart" data-title="My tray">

<div class="section-head" style="margin-top:26px">
    <div>
        <h2>My tray</h2>
        <p>Review your selected items before checkout.</p>
    </div>
</div>

<!-- <section class="panel">
    <p class="panel-sub">Your tray will appear here when connected to the canteen service.</p>
</section> -->

<section class="panel">
    <div class="table-wrap">
        <table class="data">
            <thead>
                <tr>
                    <th>Item</th>
                    <th class="num">Price</th>
                    <th>Quantity</th>
                    <th class="num">Subtotal</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="cart-body">
                <tr><td colspan="5" class="empty-row">Loading your tray…</td></tr>
            </tbody>
        </table>
    </div>

    <div class="summary">
        <div class="total"><span>Total</span><span id="cart-total">₱0.00</span></div>
    </div>
    <p id="cart-note" class="notice" hidden></p>
    <button type="button" id="checkout-btn" class="btn" style="margin-top:16px" disabled>
        Proceed to checkout
    </button>
</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="../assets/js/cart.js"></script>
<script src="../assets/js/cart-page.js"></script>

</body>
</html>
